<link rel="stylesheet" href="{{ url_for('static', filename='css/auth/login.css') }}">

<body>

    <div class="login-container">

        <!-- LEFT PANEL -->
        <section class="login-banner">

            <div class="banner-content">

                <div class="brand">

                    <i class="fa-solid fa-store"></i>

                    <h1>MNYALA</h1>

                </div>

                <h2>Welcome to the Admin Portal</h2>

                <p>
                    Manage products, orders, gallery, customers and reports
                    from one secure dashboard.
                </p>

                <div class="features">

                    <div class="feature">
                        <i class="fa-solid fa-box"></i>
                        <span>Products</span>
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Orders</span>
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-image"></i>
                        <span>Gallery</span>
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-users"></i>
                        <span>Customers</span>
                    </div>

                </div>

            </div>

        </section>

        <!-- LOGIN FORM -->
        <section class="login-form">

            <div class="form-card">

                <h2>Admin Login</h2>

                <p>Sign in to continue.</p>

                <form method="POST">

                    <div class="input-group">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" name="email" placeholder="Email Address" required>

                    </div>

                    <div class="input-group password-group">

                        <i class="fa-solid fa-lock"></i>

                        <input id="password" type="password" name="password" placeholder="Password" required>

                        <button type="button" class="toggle-password" id="togglePassword">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                    <div class="login-options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="{{ url_for('auth.forgot_password') }}">
    Forgot Password?
</a>

                    </div>

                    <button class="login-btn">

                        Login

                    </button>

                </form>

            </div>

        </section>

    </div>

    <script src="{{ url_for('static', filename='js/admin/login.js') }}"></script>

</body>
